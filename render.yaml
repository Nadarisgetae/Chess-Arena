services:
  - type: web
    name: chess-arena-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8000
      - key: OPENROUTER_API_KEYS
        sync: false
    disk:
      name: chess-data
      mountPath: /app/backend/data
      sizeGB: 1
