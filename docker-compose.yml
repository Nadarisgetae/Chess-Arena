version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chess-arena-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chess_arena.db:/app/backend/chess_arena.db
      - ./backend/stockfish:/app/backend/stockfish
    environment:
      - STOCKFISH_PATH=/app/backend/stockfish/stockfish
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
